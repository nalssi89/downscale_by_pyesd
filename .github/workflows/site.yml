# 사이트 게시: EC46 주별(out-ec46)·SEAS5 월별(out-seas5) 최신 산출을 사이트 자료로 변환해 gh-pages 브랜치에 올린다.
# GitHub 저장소 Settings → Pages → Source: "Deploy from a branch", Branch: gh-pages / (root) 로 한 번 설정하면
# https://nalssi89.github.io/downscale_by_pyesd/ 에서 볼 수 있다. 두 산출 워크플로가 끝날 때마다 자동 실행.
name: 사이트 게시
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["EC46 주별 상세예측", "SEAS5 월별 상세예측"]
    types: [completed]
  push:
    paths: ["site/**", "docs/**", ".github/workflows/site.yml"]
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: 최신 산출 가져오기 (없는 쪽은 건너뜀)
        run: |
          set -e
          mkdir -p out
          for b in ec46:ec46_weekly seas5:seas5_monthly; do
            br=out-${b%%:*}; d=out/${b#*:}
            if git fetch -q origin "$br:$br" 2>/dev/null; then mkdir -p "$d"; git archive "$br" | tar -x -C "$d"; else echo "$br 없음"; fi
          done
          ls -la out/*/ || true
      - name: 사이트 자료 변환
        run: |
          python site/build_site_data.py --ec46 out/ec46_weekly/downscaling.json --seas5 out/seas5_monthly/downscaling.json --out site/data
          mkdir -p site/docs && cp -r docs/* site/docs/
          mkdir -p site/out && cp -r out/* site/out/
      - name: gh-pages 브랜치에 올리기
        run: |
          set -e
          cp -r site /tmp/pages && cd /tmp/pages
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
